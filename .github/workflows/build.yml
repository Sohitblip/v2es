name: Build iOS ESP Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Download ImGui Repository Automatically
      uses: actions/checkout@v4
      with:
        repository: ocornut/imgui
        ref: master
        path: imgui_src

    - name: Set up iOS SDK Toolchain
      run: xcodebuild -version
        
    - name: Compile C++ Files with ImGui Metal Backend
      run: |
        clang++ -dynamiclib -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
        -arch arm64 -miphoneos-version-min=14.0 -std=c++17 \
        -framework UIKit -framework Foundation -framework QuartzCore -framework Metal -framework MetalKit \
        -I. -Iimgui_src -Iimgui_src/backends \
        imgui_src/imgui.cpp imgui_src/imgui_draw.cpp imgui_src/imgui_widgets.cpp imgui_src/imgui_tables.cpp \
        imgui_src/backends/imgui_impl_metal.mm \
        Settings.cpp Menu.cpp ESP.cpp main.mm \
        -o libiOSESP.dylib

    - name: Upload Compiled Dylib File As Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-ESP-Dylib
        path: libiOSESP.dylib
