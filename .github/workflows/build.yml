name: Build iOS ESP Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Download ImGui Source Zip
      run: |
        curl -L -o imgui.zip "https://github.com"
        unzip -q imgui.zip
        mv imgui-master imgui_src

    - name: Set up iOS SDK Toolchain
      run: xcodebuild -version
        
    - name: Compile C++ Files into iOS Arm64 Dylib
      run: |
        clang++ -dynamiclib -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -arch arm64 -miphoneos-version-min=14.0 -std=c++17 -I. -Iimgui_src imgui_src/imgui.cpp imgui_src/imgui_draw.cpp imgui_src/imgui_widgets.cpp imgui_src/imgui_tables.cpp Settings.cpp Menu.cpp ESP.cpp -o libiOSESP.dylib

    - name: Upload Compiled Dylib File As Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-ESP-Dylib
        path: libiOSESP.dylib
